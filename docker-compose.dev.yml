# version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: uptime-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uptime_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptime_secret}
      POSTGRES_DB: ${POSTGRES_DB:-uptime_monitor}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-uptime_user} -d $${POSTGRES_DB:-uptime_monitor}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata-dev:
