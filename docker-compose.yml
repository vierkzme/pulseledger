version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseledger-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uptime_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptime_secret}
      POSTGRES_DB: ${POSTGRES_DB:-uptime_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-uptime_user} -d $${POSTGRES_DB:-uptime_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pulseledger-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-uptime_user}:${POSTGRES_PASSWORD:-uptime_secret}@postgres:5432/${POSTGRES_DB:-uptime_monitor}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_pulseledger_production_key_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      WORKER_TICK_INTERVAL_MS: ${WORKER_TICK_INTERVAL_MS:-5000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      ENABLE_WORKER: ${ENABLE_WORKER:-true}
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pulseledger-client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:
